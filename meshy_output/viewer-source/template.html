<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Aurora Production — 3D Logo · Smooth v2</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eff7ff;background:#070b14}
    body{height:100svh;min-height:440px;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse at 22% 44%,#0d233950,transparent 48%),radial-gradient(ellipse at 78% 55%,#30144945,transparent 48%),#070b14}
    header{padding:25px 32px 15px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0}
    .brand{font-size:15px;font-weight:650;letter-spacing:.22em}.subtitle{font-size:11px;letter-spacing:.16em;color:#91a3b9;margin-top:8px;text-transform:uppercase}.badge{font-size:11px;color:#b2c1d3;border:1px solid #ffffff22;border-radius:30px;padding:8px 12px;white-space:nowrap}
    main{flex:1;min-height:0;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}canvas:focus-visible{outline:2px solid #6de7ff;outline-offset:-5px;border-radius:16px}
    #status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(80%,500px);text-align:center;font-size:14px;line-height:1.7;color:#b6cadd}#status[hidden]{display:none}
    footer{flex-shrink:0;padding:13px 24px 25px;text-align:center}.toolbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{font:inherit;font-size:12px;border:1px solid #ffffff24;background:#111a2c;color:#dbe8f7;border-radius:9px;min-height:42px;padding:10px 17px;cursor:pointer;transition:background .15s,border-color .15s}button:hover{background:#1c2b42;border-color:#8acbe577}button:focus-visible{outline:2px solid #64dbff;outline-offset:3px}button[aria-pressed=true]{background:#15364a;border-color:#5bd1ed;color:#a8f3ff}button:disabled{opacity:.4;cursor:wait}.hint{font-size:11px;color:#8a9db4;margin:14px 0 0;letter-spacing:.02em}
    @media(max-width:600px){header{padding:20px 20px 10px}.brand{font-size:13px}.subtitle{font-size:10px}.badge{font-size:10px;padding:6px 9px}footer{padding:10px 12px 20px}button{padding:9px 12px;font-size:11px;min-height:44px}.toolbar{gap:6px}.hint{font-size:10px}}
    @media(prefers-reduced-motion:reduce){button{transition:none}}
  </style>
</head>
<body>
  <header><div><div class="brand">AURORA</div><div class="subtitle">Production · 3D logo</div></div><span class="badge">Smooth relief · Concept v2</span></header>
  <main id="stage"><div id="status" role="status" aria-live="polite">Opening your 3D logo…</div></main>
  <footer><div class="toolbar" aria-label="3D viewer controls">
    <button id="rotate" type="button" aria-pressed="false" disabled>Auto rotate</button>
    <button id="reset" type="button" disabled>Reset view</button>
    <button id="wireframe" type="button" aria-pressed="false" disabled>Wireframe</button>
    <button id="save" type="button" title="Save the current view as a transparent PNG" disabled>Save PNG</button>
  </div><p class="hint" id="loading-label">Loading embedded model</p></footer>
  <script id="model-data" type="application/octet-stream">__MODEL_BASE64__</script>
  <script>/* EMBED_VIEWER */</script>
</body>
</html>
